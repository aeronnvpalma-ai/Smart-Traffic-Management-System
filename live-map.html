<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Live traffic map"><title>Live Traffic Map | Smart Traffic</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""><style>:root{--navy:#0f172a;--line:#e2e8f0;--bg:#f1f5f9;--blue:#2563eb;--green:#10b981;--amber:#f59e0b;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1e293b;font-family:Inter,system-ui,sans-serif}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:20px}.brand{display:flex;gap:10px;align-items:center;margin-bottom:20px}.brand-icon{font-size:28px}.brand small{display:block;color:#64748b;font-size:11px}.nav{display:flex;flex-direction:column;gap:7px}.nav a{color:#334155;text-decoration:none;padding:10px;border-radius:8px}.nav a:hover,.nav a.active{background:#eff6ff;color:var(--blue)}.main{min-width:0;padding:22px}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.header h1{margin:0}.subtitle{color:#64748b;margin-top:8px}.status{color:var(--green);font-size:14px}.pulse{width:9px;height:9px;background:var(--green);border-radius:50%;display:inline-block;margin-right:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.stat{background:#fff;padding:15px;border:1px solid var(--line);border-radius:10px}.stat small{display:block;color:#64748b}.stat strong{display:block;font-size:22px;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}.toolbar select,.btn{padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.btn{cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.map-wrap{position:relative;margin-top:14px}.map{height:560px;border-radius:10px;border:1px solid var(--line);z-index:1}.legend{position:absolute;right:12px;top:12px;background:#fff;padding:10px;border:1px solid var(--line);border-radius:8px;z-index:500}.legend-row{margin-top:5px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}.dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}@media(max-width:700px){.app{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.nav{flex-direction:row;overflow:auto}.nav a{white-space:nowrap}.main{padding:16px}.stats{grid-template-columns:1fr}.header{display:block}.map{height:65vh;min-height:380px}.legend{position:relative;right:auto;top:auto;margin-top:8px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">🚦</div><div><strong>Smart Traffic</strong><small>Management System</small></div></div><nav class="nav"><a href="index.html">Dashboard</a><a class="active" href="live-map.html">Live Traffic Map</a><a href="traffic-portal.html">Portal</a><a href="traffic-bot.html">Traffic Bot</a></nav></aside><main class="main"><header class="header"><div><h1>Live Traffic Map</h1><p class="subtitle">Network conditions and monitored corridors</p></div><div class="status"><span class="pulse"></span><span id="lastUpdated">Live · updating now</span></div></header><div class="stats"><div class="stat"><small>Monitored corridors</small><strong id="corridors">8</strong></div><div class="stat"><small>Average speed</small><strong id="speed">34 km/h</strong></div><div class="stat"><small>Active incidents</small><strong id="incidents">2</strong></div></div><div class="toolbar"><select id="filter" aria-label="Filter traffic"><option value="all">All conditions</option><option value="green">Free flowing</option><option value="amber">Moderate</option><option value="red">Congested</option></select><button class="btn" id="locate">⌖ Locate me</button><button class="btn primary" id="refresh">↻ Refresh data</button><label for="destination">Destination</label><select id="destination"><option>City Hall</option><option>Airport</option><option>Central Market</option><option>University</option></select><button class="btn" id="showWay">Show way</button></div><div class="map-wrap"><div id="map" class="map" aria-label="Interactive traffic map"></div><div class="legend"><strong>Traffic speed</strong><div class="legend-row"><i class="dot green"></i>Free flowing</div><div class="legend-row"><i class="dot amber"></i>Moderate</div><div class="legend-row"><i class="dot red"></i>Congested</div></div></div></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script>
const roads=[['Main Street','Downtown',38,'green',[[14.5995,120.9842],[14.603,120.991],[14.6065,120.9975]]],['North Avenue','North District',18,'red',[[14.6065,120.9975],[14.6145,120.9985],[14.622,121]]],['East Ring Road','East District',46,'green',[[14.603,120.991],[14.5955,121.0035],[14.589,121.012]]],['Central Boulevard','Central District',27,'amber',[[14.5995,120.9842],[14.5925,120.984],[14.584,120.982]]],['Airport Road','Airport District',31,'amber',[[14.622,121],[14.635,121.012],[14.648,121.02]]],['Riverside Drive','West District',51,'green',[[14.584,120.982],[14.575,120.974],[14.567,120.969]]],['Market Link','Market District',20,'red',[[14.5925,120.984],[14.588,120.992],[14.584,121.001]]],['Harbor Route','South District',42,'green',[[14.567,120.969],[14.558,120.975],[14.548,120.98]]]];const colors={green:'#10b981',amber:'#f59e0b',red:'#ef4444'},locations={'City Hall':[14.5995,120.9842],Airport:[14.648,121.02],'Central Market':[14.5925,120.984],University:[14.584,121.001]};const map=L.map('map').setView([14.596,120.991],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);let layers=[],routeLayer,markers=[];function render(){layers.forEach(x=>map.removeLayer(x));layers=[];const f=document.getElementById('filter').value,visible=roads.filter(r=>f==='all'||r[3]===f);visible.forEach(r=>{const line=L.polyline(r[4],{color:colors[r[3]],weight:7,opacity:.9}).addTo(map).bindPopup('<b>'+r[0]+'</b><br>'+r[1]+'<br>Average speed: '+r[2]+' km/h');layers.push(line)});document.getElementById('corridors').textContent=visible.length;document.getElementById('speed').textContent=(visible.length?Math.round(visible.reduce((s,r)=>s+r[2],0)/visible.length):0)+' km/h';document.getElementById('incidents').textContent=roads.filter(r=>r[3]==='red').length;document.getElementById('lastUpdated').textContent='Live · updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}render();document.getElementById('filter').onchange=render;document.getElementById('refresh').onclick=()=>{roads.forEach(r=>{r[2]=Math.max(12,Math.min(55,r[2]+Math.round((Math.random()-.5)*10)));r[3]=r[2]<23?'red':r[2]<34?'amber':'green'});render()};document.getElementById('locate').onclick=()=>{if(!navigator.geolocation)return alert('Location is not available in this browser.');navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],15);L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup('Your current location').openPopup()},()=>alert('Unable to access your location. Check browser permissions.'))};document.getElementById('showWay').onclick=()=>{const dest=locations[document.getElementById('destination').value];if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.polyline([[14.5995,120.9842],dest],{color:'#2563eb',weight:6,dashArray:'8,6'}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[50,50]})};setInterval(render,30000);
</script></body></html>
