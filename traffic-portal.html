<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Traffic Portal - Smart Traffic Management">
  <title>Traffic Portal</title>
  <style>
    :root{--navy:#0f172a;--blue:#2563eb;--blue-dark:#1d4ed8;--bg:#f1f5f9;--line:#e2e8f0;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0f172a,#2563eb);color:var(--navy)}.login-page{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(100%,420px);padding:30px 28px;background:#fff;border-radius:18px;box-shadow:0 20px 50px #0f172a40}.brand{text-align:center;font-size:52px;margin-bottom:12px}h1{margin:0;text-align:center;font-size:28px}.subtitle{text-align:center;color:var(--muted);margin:8px 0 24px}.field{margin-bottom:18px}label{display:block;margin-bottom:8px;font-weight:700}input,button{font:inherit}input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px}button{width:100%;padding:12px 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}button:hover{background:var(--blue-dark)}
  </style>
</head>
<body>
  <div class="login-page"><form id="portalLogin" class="login-card"><div class="brand">🚦</div><h1>Traffic Portal</h1><p class="subtitle">Sign in to continue</p><div class="field"><label for="username">Username</label><input id="username" type="text" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button type="submit">Sign In</button></form></div>
  <script>
    const users={admin:'Administrator',officer:'Traffic Officer',viewer:'Viewer'};
    document.getElementById('portalLogin').addEventListener('submit',event=>{event.preventDefault();const username=document.getElementById('username').value.trim();const password=document.getElementById('password').value;if(users[username]&&password==='1234'){localStorage.setItem('currentUser',username);window.location.href='index.html'}else alert('Invalid username or password.');});
  </script>
</body>
</html>
