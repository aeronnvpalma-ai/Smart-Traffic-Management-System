<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart Traffic Live Map - Real-time traffic conditions">
  <title>Live Traffic Map - Smart Traffic Management</title>
  <style>
    :root {
      --navy: #0f172a;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --bg: #f1f5f9;
      --line: #e2e8f0;
      --muted: #64748b;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--navy);
    }
    .header {
      background: white;
      border-bottom: 1px solid var(--line);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { font-size: 28px; }
    .title { margin: 0; font-size: 20px; font-weight: 700; }
    .subtitle { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .header-right { display: flex; gap: 12px; align-items: center; }
    .btn {
      padding: 9px 16px;
      border-radius: 10px;
      text-decoration: none;
      border: 1px solid var(--line);
      background: white;
      color: var(--navy);
      cursor: pointer;
      font-weight: 700;
      display: inline-block;
    }
    .btn.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }
    .container {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: calc(100vh - 74px);
    }
    .sidebar {
      background: white;
      border-right: 1px solid var(--line);
      padding: 20px;
    }
    .sidebar-title {
      margin: 0 0 14px;
      font-size: 12px;
      letter-spacing: 0.6px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
    }
    .filter-option {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      font-weight: 600;
      color: var(--navy);
    }
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .green { background: var(--green); }
    .amber { background: var(--amber); }
    .red { background: var(--red); }
    .map-panel {
      position: relative;
      background: linear-gradient(180deg, #eef6ff, #f8fafc);
      overflow: hidden;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .corridor-line {
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 10;
      cursor: pointer;
      transition: stroke-width 0.2s ease;
    }
    .corridor-line:hover {
      stroke-width: 14;
    }
    .corridor-label {
      font-size: 12px;
      font-weight: 700;
      text-anchor: middle;
      fill: var(--navy);
    }
    .tooltip {
      position: absolute;
      left: 20px;
      top: 20px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      padding: 12px 14px;
      min-width: 170px;
      display: none;
      pointer-events: none;
    }
    .tooltip.visible { display: block; }
    .tooltip-title {
      font-weight: 800;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .tooltip-body {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .stats-box {
      position: absolute;
      right: 20px;
      bottom: 20px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 12px 14px;
      min-width: 190px;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
      color: var(--muted);
    }
    .stats-row strong { color: var(--navy); }
    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">🗺️</div>
      <div>
        <p class="title">Live Traffic Map</p>
        <p class="subtitle">Queue and corridor status</p>
      </div>
    </div>
    <div class="header-right">
      <button id="refreshBtn" class="btn primary" type="button">🔄 Refresh</button>
      <a href="index.html" class="btn">← Dashboard</a>
    </div>
  </div>

  <div class="container">
    <aside class="sidebar">
      <p class="sidebar-title">Filter by status</p>
      <div class="filter-option"><input id="filterGreen" type="checkbox" checked><span class="status-dot green"></span>Free Flow</div>
      <div class="filter-option"><input id="filterAmber" type="checkbox" checked><span class="status-dot amber"></span>Moderate</div>
      <div class="filter-option"><input id="filterRed" type="checkbox" checked><span class="status-dot red"></span>Congestion</div>
    </aside>

    <div class="map-panel">
      <svg id="map" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" aria-label="Traffic map"></svg>
      <div id="tooltip" class="tooltip" role="tooltip"></div>
      <div class="stats-box">
        <div class="stats-row"><span>Free Flow</span><strong id="statGreen">0</strong></div>
        <div class="stats-row"><span>Moderate</span><strong id="statAmber">0</strong></div>
        <div class="stats-row"><span>Congestion</span><strong id="statRed">0</strong></div>
      </div>
    </div>
  </div>

  <script>
    const corridors = [
      { name: 'EDSA North', x1: 100, y1: 100, x2: 100, y2: 520, status: 'free' },
      { name: 'EDSA South', x1: 890, y1: 100, x2: 890, y2: 520, status: 'moderate' },
      { name: 'Commonwealth Ave', x1: 150, y1: 260, x2: 850, y2: 260, status: 'free' },
      { name: 'Quezon Ave', x1: 220, y1: 150, x2: 820, y2: 360, status: 'congested' },
      { name: 'España Blvd', x1: 300, y1: 100, x2: 300, y2: 600, status: 'moderate' },
      { name: 'Aurora Blvd', x1: 600, y1: 160, x2: 600, y2: 560, status: 'free' },
      { name: 'Morayta St', x1: 100, y1: 420, x2: 900, y2: 420, status: 'moderate' },
      { name: 'Romualdez St', x1: 200, y1: 520, x2: 800, y2: 300, status: 'free' }
    ];

    function getColor(status) {
      if (status === 'free') return '#10b981';
      if (status === 'moderate') return '#f59e0b';
      return '#ef4444';
    }

    function getLabel(status) {
      if (status === 'free') return 'Free Flow';
      if (status === 'moderate') return 'Moderate';
      return 'Congestion';
    }

    function checkVisible(status) {
      if (status === 'free') return document.getElementById('filterGreen').checked;
      if (status === 'moderate') return document.getElementById('filterAmber').checked;
      return document.getElementById('filterRed').checked;
    }

    function drawMap() {
      const svg = document.getElementById('map');
      svg.innerHTML = '';
      let counts = { free: 0, moderate: 0, congested: 0 };

      corridors.forEach((corridor) => {
        if (!checkVisible(corridor.status)) return;

        if (corridor.status === 'free') counts.free++;
        if (corridor.status === 'moderate') counts.moderate++;
        if (corridor.status === 'congested') counts.congested++;

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', corridor.x1);
        line.setAttribute('y1', corridor.y1);
        line.setAttribute('x2', corridor.x2);
        line.setAttribute('y2', corridor.y2);
        line.setAttribute('stroke', getColor(corridor.status));
        line.setAttribute('class', 'corridor-line');
        line.setAttribute('data-name', corridor.name);
        line.setAttribute('data-status', corridor.status);
        line.style.stroke = getColor(corridor.status);

        line.addEventListener('mousemove', (event) => showTooltip(event, corridor));
        line.addEventListener('mouseleave', hideTooltip);
        line.addEventListener('click', () => alert(`${corridor.name}\nStatus: ${getLabel(corridor.status)}`));

        svg.appendChild(line);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', (corridor.x1 + corridor.x2) / 2);
        text.setAttribute('y', (corridor.y1 + corridor.y2) / 2 - 6);
        text.setAttribute('class', 'corridor-label');
        text.textContent = corridor.name;
        svg.appendChild(text);
      });

      document.getElementById('statGreen').textContent = counts.free;
      document.getElementById('statAmber').textContent = counts.moderate;
      document.getElementById('statRed').textContent = counts.congested;
    }

    function showTooltip(event, corridor) {
      const tooltip = document.getElementById('tooltip');
      const rect = document.getElementById('map').getBoundingClientRect();
      tooltip.innerHTML = `
        <div class="tooltip-title">${corridor.name}</div>
        <div class="tooltip-body">
          Status: ${getLabel(corridor.status)}<br>
          Speed: ${corridor.status === 'free' ? '50 km/h' : corridor.status === 'moderate' ? '28 km/h' : '12 km/h'}
        </div>
      `;
      tooltip.classList.add('visible');
      tooltip.style.left = `${event.clientX - rect.left + 16}px`;
      tooltip.style.top = `${event.clientY - rect.top + 16}px`;
    }

    function hideTooltip() {
      document.getElementById('tooltip').classList.remove('visible');
    }

    function randomizeTraffic() {
      corridors.forEach((corridor) => {
        const random = Math.random();
        corridor.status = random < 0.33 ? 'free' : random < 0.66 ? 'moderate' : 'congested';
      });
      drawMap();
    }

    document.getElementById('filterGreen').addEventListener('change', drawMap);
    document.getElementById('filterAmber').addEventListener('change', drawMap);
    document.getElementById('filterRed').addEventListener('change', drawMap);
    document.getElementById('refreshBtn').addEventListener('click', randomizeTraffic);

    drawMap();
    setInterval(randomizeTraffic, 30000);
  </script>
</body>
</html>
