<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quezon City live traffic map with directions and destinations">
  <title>Quezon City Live Traffic Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root { --blue:#1a73e8; --text:#202124; --muted:#5f6368; --line:#dadce0; --green:#188038; --amber:#f9ab00; --red:#d93025; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, sans-serif; color:var(--text); background:#fff; }
    .header { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; border-bottom:1px solid var(--line); box-shadow:0 1px 4px #0002; position:relative; z-index:1; }
    .brand { display:flex; gap:10px; align-items:center; font-size:18px; font-weight:600; }
    .brand span { font-size:25px; }
    .actions { display:flex; gap:8px; }
    button, a.button { border:1px solid var(--line); background:#fff; border-radius:6px; padding:9px 13px; cursor:pointer; font-weight:600; color:var(--text); text-decoration:none; font-size:13px; }
    button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
    button:hover, a.button:hover { background:#f1f3f4; }
    button.primary:hover { background:#1557b0; }
    .layout { display:grid; grid-template-columns:310px 1fr; height:calc(100vh - 64px); }
    .panel { padding:18px; overflow:auto; border-right:1px solid var(--line); background:#fff; }
    h1 { font-size:20px; margin:0 0 4px; }
    .subtitle { margin:0 0 18px; color:var(--muted); font-size:13px; }
    .field { margin-bottom:12px; }
    label { display:block; font-size:12px; color:var(--muted); font-weight:700; margin-bottom:5px; }
    select, input { width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; background:#fff; font-size:14px; }
    .route-buttons { display:flex; gap:8px; margin:14px 0 18px; }
    .route-buttons button { flex:1; }
    .card { border:1px solid var(--line); border-radius:8px; padding:13px; margin-top:16px; }
    .card-title { font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700; margin-bottom:10px; }
    .legend-row { display:flex; align-items:center; gap:8px; font-size:13px; margin:8px 0; }
    .dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
    .green { background:var(--green); } .amber { background:var(--amber); } .red { background:var(--red); }
    .traffic-row { display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px solid #f1f3f4; }
    .traffic-row:last-child { border-bottom:0; }
    #routeSummary { color:var(--muted); font-size:13px; line-height:1.5; }
    #map { width:100%; height:100%; background:#e8f0fe; }
    .leaflet-control-attribution { font-size:10px; }
    @media (max-width:800px) {
      .header { height:auto; min-height:64px; gap:10px; flex-wrap:wrap; padding:10px 14px; }
      .layout { grid-template-columns:1fr; height:auto; }
      .panel { border-right:0; border-bottom:1px solid var(--line); }
      #map { height:65vh; min-height:420px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand"><span>🗺️</span> Quezon City Live Traffic Map</div>
    <div class="actions">
      <button id="refreshBtn" class="primary" type="button">↻ Refresh traffic</button>
      <a class="button" href="index.html">Dashboard</a>
    </div>
  </header>

  <div class="layout">
    <aside class="panel">
      <h1>Quezon City</h1>
      <p class="subtitle">Traffic conditions, destinations, and directions</p>

      <div class="field">
        <label for="origin">STARTING POINT</label>
        <select id="origin">
          <option value="14.6760,121.0437">Quezon City Hall</option>
          <option value="14.6390,121.0550">UP Diliman</option>
          <option value="14.6460,121.0500">Trinoma</option>
          <option value="14.6290,121.0640">Cubao</option>
        </select>
      </div>

      <div class="field">
        <label for="destination">DESTINATION</label>
        <select id="destination">
          <option value="14.6460,121.0500">Trinoma</option>
          <option value="14.6390,121.0550">UP Diliman</option>
          <option value="14.6290,121.0640">Araneta City, Cubao</option>
          <option value="14.6760,121.0437">Quezon City Hall</option>
          <option value="14.6570,121.0320">Fairview</option>
          <option value="14.6200,121.0000">SM North EDSA</option>
        </select>
      </div>

      <div class="route-buttons">
        <button id="directionsBtn" class="primary" type="button">Directions</button>
        <button id="clearBtn" type="button">Clear</button>
      </div>

      <div class="card">
        <div class="card-title">Route details</div>
        <div id="routeSummary">Choose a starting point and destination, then select Directions.</div>
      </div>

      <div class="card">
        <div class="card-title">Traffic legend</div>
        <div class="legend-row"><span class="dot green"></span> Free flow</div>
        <div class="legend-row"><span class="dot amber"></span> Moderate traffic</div>
        <div class="legend-row"><span class="dot red"></span> Heavy traffic</div>
      </div>

      <div class="card">
        <div class="card-title">Main roads</div>
        <div id="trafficList"></div>
      </div>
    </aside>
    <main id="map" aria-label="Interactive map of Quezon City"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const qcCenter = [14.6507, 121.0494];
    const map = L.map('map', { zoomControl: true }).setView(qcCenter, 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const roads = [
      { name: 'EDSA', point: [14.6397, 121.0488], status: 'green', speed: 42 },
      { name: 'Commonwealth Avenue', point: [14.6680, 121.0560], status: 'red', speed: 16 },
      { name: 'Quezon Avenue', point: [14.6420, 121.0250], status: 'amber', speed: 28 },
      { name: 'Aurora Boulevard', point: [14.6290, 121.0640], status: 'green', speed: 39 },
      { name: 'España Boulevard', point: [14.6200, 121.0100], status: 'amber', speed: 25 },
      { name: 'Katipunan Avenue', point: [14.6420, 121.0730], status: 'red', speed: 14 },
      { name: 'Roosevelt Avenue', point: [14.6570, 121.0320], status: 'amber', speed: 27 }
    ];
    const colors = { green: '#188038', amber: '#f9ab00', red: '#d93025' };
    const labels = { green: 'Free flow', amber: 'Moderate', red: 'Heavy traffic' };
    const roadMarkers = [];

    roads.forEach((road) => {
      const marker = L.circleMarker(road.point, {
        radius: 9,
        color: '#fff',
        weight: 2,
        fillColor: colors[road.status],
        fillOpacity: 0.95
      }).addTo(map);
      marker.bindPopup(`<strong>${road.name}</strong><br><span style="color:${colors[road.status]}">${labels[road.status]}</span><br>Average speed: ${road.speed} km/h`);
      roadMarkers.push({ marker, road });
    });

    function renderTrafficList() {
      const trafficList = document.getElementById('trafficList');
      trafficList.innerHTML = roads.map((road) => `
        <div class="traffic-row"><span>${road.name}</span><strong style="color:${colors[road.status]}">${road.speed} km/h</strong></div>
      `).join('');
    }
    renderTrafficList();

    let startMarker = null;
    let destinationMarker = null;
    let routeLine = null;

    function coords(id) {
      return document.getElementById(id).value.split(',').map(Number);
    }

    function name(id) {
      return document.getElementById(id).selectedOptions[0].textContent;
    }

    async function showDirections() {
      const start = coords('origin');
      const destination = coords('destination');
      const routeSummary = document.getElementById('routeSummary');

      if (start[0] === destination[0] && start[1] === destination[1]) {
        routeSummary.textContent = 'Choose two different locations.';
        return;
      }

      if (startMarker) map.removeLayer(startMarker);
      if (destinationMarker) map.removeLayer(destinationMarker);
      if (routeLine) map.removeLayer(routeLine);

      startMarker = L.marker(start).addTo(map).bindPopup(`<strong>Start</strong><br>${name('origin')}`).openPopup();
      destinationMarker = L.marker(destination).addTo(map).bindPopup(`<strong>Destination</strong><br>${name('destination')}`);
      routeSummary.textContent = 'Loading route directions…';

      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('Route service unavailable');

        const data = await response.json();
        if (!data.routes || !data.routes[0]) throw new Error('No route found');

        const route = data.routes[0];
        routeLine = L.geoJSON(route.geometry, { style: { color: '#1a73e8', weight: 6, opacity: 0.85 } }).addTo(map);
        map.fitBounds(routeLine.getBounds(), { padding: [35, 35] });

        const distanceKm = (route.distance / 1000).toFixed(1);
        const durationMinutes = Math.max(1, Math.round(route.duration / 60));
        routeSummary.innerHTML = `<strong>${name('origin')} → ${name('destination')}</strong><br>${distanceKm} km · about ${durationMinutes} min`;
      } catch (error) {
        routeLine = L.polyline([start, destination], { color: '#1a73e8', weight: 5, dashArray: '8 8' }).addTo(map);
        map.fitBounds(routeLine.getBounds(), { padding: [35, 35] });
        routeSummary.textContent = `${name('origin')} → ${name('destination')}. Straight-line preview shown; detailed routing is temporarily unavailable.`;
      }
    }

    document.getElementById('directionsBtn').addEventListener('click', showDirections);
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (startMarker) map.removeLayer(startMarker);
      if (destinationMarker) map.removeLayer(destinationMarker);
      if (routeLine) map.removeLayer(routeLine);
      startMarker = destinationMarker = routeLine = null;
      map.setView(qcCenter, 13);
      document.getElementById('routeSummary').textContent = 'Choose a starting point and destination, then select Directions.';
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      roads.forEach((road) => {
        const statuses = ['green', 'amber', 'red'];
        road.status = statuses[Math.floor(Math.random() * statuses.length)];
        road.speed = road.status === 'green'
          ? 35 + Math.floor(Math.random() * 20)
          : road.status === 'amber'
            ? 20 + Math.floor(Math.random() * 15)
            : 8 + Math.floor(Math.random() * 12);
      });

      roadMarkers.forEach(({ marker, road }) => {
        marker.setStyle({ fillColor: colors[road.status] });
        marker.bindPopup(`<strong>${road.name}</strong><br><span style="color:${colors[road.status]}">${labels[road.status]}</span><br>Average speed: ${road.speed} km/h`);
      });
      renderTrafficList();
    });
  </script>
</body>
</html>
