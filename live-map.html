<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Live traffic map for Smart Traffic Management System">
  <title>Live Traffic Map | Smart Traffic</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root{--navy:#0f172a;--blue:#2563eb;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--green:#10b981;--amber:#f59e0b;--red:#ef4444}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1e293b;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:20px}.brand{display:flex;gap:10px;align-items:center;margin-bottom:10px}.brand-icon{font-size:28px}.nav{display:flex;flex-direction:column;gap:8px}.nav a{color:#334155;text-decoration:none;padding:8px;border-radius:8px}.nav a.active{background:#f8fafc}.main{padding:20px}.header{display:flex;justify-content:space-between;align-items:center}.stats{display:flex;gap:12px;margin-top:12px}.stat{background:#fff;padding:12px;border:1px solid var(--line);border-radius:10px}.toolbar{display:flex;gap:8px;margin-top:12px;align-items:center}.map-card{margin-top:12px}.map-wrap{position:relative}.map{height:560px;border-radius:10px;border:1px solid var(--line)}.legend{position:absolute;right:12px;top:12px;background:#fff;padding:8px;border:1px solid var(--line);border-radius:8px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}.dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">🚦</div>
        <div><strong>Smart Traffic</strong><small>Management System</small></div>
      </div>
      <nav class="nav">
        <a href="index.html">Dashboard</a>
        <a class="active" href="live-map.html">Live Traffic Map</a>
        <a href="traffic-portal.html">Portal</a>
        <a href="traffic-bot.html">Traffic Bot</a>
      </nav>
    </aside>

    <main class="main">
      <header class="header">
        <div>
          <h1>Live Traffic Map</h1>
          <p class="subtitle">Real-time network conditions and monitored corridors</p>
        </div>
        <div class="status"><span class="pulse"></span><span id="lastUpdated">Live · updating now</span></div>
      </header>

      <section class="content">
        <div class="stats">
          <div class="stat"><small>Monitored corridors</small><strong id="corridors">8</strong></div>
          <div class="stat"><small>Average speed</small><strong id="speed">34 km/h</strong></div>
          <div class="stat"><small>Active incidents</small><strong id="incidents">2</strong></div>
        </div>

        <div class="toolbar">
          <select class="select" id="filter">
            <option value="all">All conditions</option>
            <option value="green">Free flowing</option>
            <option value="amber">Moderate</option>
            <option value="red">Congested</option>
          </select>
          <button class="btn" id="locate">⌖ Locate me</button>
          <button class="btn primary" id="refresh">↻ Refresh data</button>

          <label for="destination" style="margin-left:8px">Destination</label>
          <select id="destination">
            <option value="City Hall">City Hall</option>
            <option value="Airport">Airport</option>
            <option value="Central Market">Central Market</option>
            <option value="University">University</option>
          </select>
          <button class="btn" id="showWay">Show way</button>
        </div>

        <div class="map-card">
          <div class="map-wrap">
            <div id="map" class="map"></div>
            <div class="legend">
              <strong>Traffic speed</strong>
              <div class="legend-row"><i class="dot green"></i> Free flowing</div>
              <div class="legend-row"><i class="dot amber"></i> Moderate</div>
              <div class="legend-row"><i class="dot red"></i> Congested</div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const roads = [
      {name:'Main Street', area:'Downtown', speed:38, condition:'green', coords:[[14.5995,120.9842],[14.6030,120.9910],[14.6065,120.9975]]},
      {name:'North Avenue', area:'North District', speed:18, condition:'red', coords:[[14.6065,120.9975],[14.6145,120.9985],[14.6220,121.0000]]},
      {name:'East Ring Road', area:'East District', speed:46, condition:'green', coords:[[14.6030,120.9910],[14.5955,121.0035],[14.5890,121.0120]]},
      {name:'Central Boulevard', area:'Central District', speed:27, condition:'amber', coords:[[14.5995,120.9842],[14.5925,120.9840],[14.5840,120.9820]]},
      {name:'Airport Road', area:'Airport District', speed:31, condition:'amber', coords:[[14.6220,121.0000],[14.6350,121.0120],[14.6480,121.0200]]},
      {name:'Riverside Drive', area:'West District', speed:51, condition:'green', coords:[[14.5840,120.9820],[14.5750,120.9740],[14.5670,120.9690]]},
      {name:'Market Link', area:'Market District', speed:20, condition:'red', coords:[[14.5925,120.9840],[14.5880,120.9920],[14.5840,121.0010]]},
      {name:'Harbor Route', area:'South District', speed:42, condition:'green', coords:[[14.5670,120.9690],[14.5580,120.9750],[14.5480,120.9800]]}
    ];

    const locations = {
      'City Hall': [14.5995, 120.9842],
      'Airport': [14.6480, 121.0200],
      'Central Market': [14.5925, 120.9840],
      'University': [14.5840, 121.0010]
    };

    const QC_BOUNDS = {
      minLat: 14.54,
      maxLat: 14.72,
      minLng: 120.95,
      maxLng: 121.09
    };

    function isWithinQuezonCity([lat, lng]) {
      return lat >= QC_BOUNDS.minLat && lat <= QC_BOUNDS.maxLat && lng >= QC_BOUNDS.minLng && lng <= QC_BOUNDS.maxLng;
    }

    function clampToQuezonCity([lat, lng]) {
      const clampedLat = Math.min(Math.max(lat, QC_BOUNDS.minLat), QC_BOUNDS.maxLat);
      const clampedLng = Math.min(Math.max(lng, QC_BOUNDS.minLng), QC_BOUNDS.maxLng);
      return [clampedLat, clampedLng];
    }

    const colors = { green: '#10b981', amber: '#f59e0b', red: '#ef4444' };
    let map, layers = [];
    let routeLayer = null;
    let originMarker = null;
    let destMarker = null;

    function renderData(filter='all') {
      layers.forEach(layer => map.removeLayer(layer));
      layers = [];

      const visible = roads.filter(r => filter === 'all' || r.condition === filter);

      visible.forEach(route => {
        const line = L.polyline(route.coords, {
          color: colors[route.condition],
          weight: 7,
          opacity: 0.9,
          lineCap: 'round'
        }).addTo(map);

        line.bindPopup(`
          <div class="popup">
            <h3>${route.name}</h3>
            <p>${route.area}</p>
            <p>Average speed: <strong>${route.speed} km/h</strong></p>
            <span class="tag ${route.condition}">${route.condition === 'green' ? 'Free flowing' : route.condition === 'amber' ? 'Moderate' : 'Congested'}</span>
          </div>
        `);

        layers.push(line);

        const marker = L.circleMarker(route.coords[Math.floor(route.coords.length / 2)], {
          radius: 7,
          fillColor: colors[route.condition],
          color: '#fff',
          weight: 2,
          fillOpacity: 1
        }).addTo(map);

        marker.bindPopup(`<div class="popup"><h3>${route.name}</h3><p>Updated just now · ${route.speed} km/h</p></div>`);
        layers.push(marker);
      });

      document.getElementById('corridors').textContent = visible.length;
      const avg = visible.length ? Math.round(visible.reduce((sum, r) => sum + r.speed, 0) / visible.length) : 0;
      document.getElementById('speed').textContent = `${avg} km/h`;
      window.avgNetworkSpeedKmh = avg || 35;

      document.getElementById('incidents').textContent = roads.filter(r => r.condition === 'red').length;
      document.getElementById('lastUpdated').textContent = 'Live · updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function clearRoute() {
      if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
      if (originMarker) { map.removeLayer(originMarker); originMarker = null; }
      if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
    }

    function haversineDistance(a, b) {
      const toRad = (v) => v * Math.PI / 180;
      const lat1 = a[0], lon1 = a[1], lat2 = b[0], lon2 = b[1];
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const x = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
      return R * c;
    }

    map = L.map('map').setView([14.596, 120.991], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    renderData();

    document.getElementById('filter').addEventListener('change', (e) => renderData(e.target.value));

    document.getElementById('refresh').addEventListener('click', () => {
      roads.forEach(route => {
        const delta = (Math.random() - 0.5) * 10;
        route.speed = Math.max(12, Math.min(55, route.speed + Math.round(delta)));
        if (route.speed < 23) route.condition = 'red';
        else if (route.speed < 34) route.condition = 'amber';
        else route.condition = 'green';
      });
      renderData(document.getElementById('filter').value);
    });

    document.getElementById('locate').addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert('Location is not available in this browser.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude } = position.coords;
          const coords = [latitude, longitude];
          const valid = isWithinQuezonCity(coords);
          const finalCoords = valid ? coords : clampToQuezonCity(coords);

          if (!valid) {
            alert('Your device is outside Quezon City. Using the nearest Quezon City location instead.');
          }

          map.setView(finalCoords, 15);
          if (originMarker) map.removeLayer(originMarker);
          originMarker = L.marker(finalCoords).addTo(map).bindPopup('Your location in Quezon City').openPopup();
        },
        () => alert('Unable to access your location. Please check browser permissions.')
      );
    });

    document.getElementById('showWay').addEventListener('click', () => {
      const destName = document.getElementById('destination').value;
      const dest = locations[destName];
      if (!dest) return alert('Unknown destination');

      function drawFrom(originCoords) {
        const normalizedOrigin = isWithinQuezonCity(originCoords) ? originCoords : clampToQuezonCity(originCoords);
        clearRoute();
        routeLayer = L.polyline([normalizedOrigin, dest], { color: '#2563eb', weight: 6, opacity: 0.95, dashArray: '8,6' }).addTo(map);
        originMarker = L.circleMarker(normalizedOrigin, { radius:6, fillColor:'#2563eb', color:'#fff', weight:2, fillOpacity:1 }).addTo(map).bindPopup('Origin').openPopup();
        destMarker = L.marker(dest).addTo(map).bindPopup(destName).openPopup();
        map.fitBounds(L.latLngBounds([normalizedOrigin, dest]), { padding: [60,60] });

        const distKm = haversineDistance(normalizedOrigin, dest);
        const speedKmh = window.avgNetworkSpeedKmh || 35;
        const etaMinutes = Math.max(1, Math.round((distKm / speedKmh) * 60));
        const hours = Math.floor(etaMinutes / 60);
        const rem = etaMinutes % 60;
        const etaStr = hours ? `${hours}h ${rem}m (${etaMinutes} minutes)` : `${rem} minutes`;
        destMarker.bindPopup(`${destName}<br>Distance: ${distKm.toFixed(2)} km<br>ETA: ${etaStr}`).openPopup();
      }

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
          const coords = [position.coords.latitude, position.coords.longitude];
          if (!isWithinQuezonCity(coords)) {
            alert('Location is outside Quezon City. Using the nearest valid Quezon City point.');
          }
          drawFrom(coords);
        }, (err) => {
          drawFrom([map.getCenter().lat, map.getCenter().lng]);
        });
      } else {
        drawFrom([map.getCenter().lat, map.getCenter().lng]);
      }
    });

    setInterval(() => renderData(document.getElementById('filter').value), 30000);
  </script>
</body>
</html>
